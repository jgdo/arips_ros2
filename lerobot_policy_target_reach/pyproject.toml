[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_target_reach"
version = "0.1.0"
description = "LeRobot plugin: predict the joint pose at an annotated target frame (frozen ResNet18 + MLP)."
requires-python = ">=3.10"
dependencies = ["lerobot>=0.6.1", "torch", "torchvision", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]
