controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Same name as on the real robot, so consumers of
    # /feetech_joint_state_broadcaster/joint_states work unchanged
    feetech_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    kinect_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# All joints (incl. drive wheels) on /joint_states for robot_state_publisher
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

feetech_joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - joint_slider
      - joint_2
      - joint_3
      - joint_4
      - joint_door_gripper
      - kinect_joint
    interfaces:
      - position
      - velocity

arm_forward_position_controller:
  ros__parameters:
    joints:
      - joint_slider
      - joint_2
      - joint_3
      - joint_4
      - joint_door_gripper
    interface_name: position

kinect_forward_position_controller:
  ros__parameters:
    joints:
      - kinect_joint
    interface_name: position

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_drive_wheel_joint"]
    right_wheel_names: ["right_drive_wheel_joint"]
    wheel_separation: 0.31
    wheel_radius: 0.055

    base_frame_id: arips_wheel_center
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 3.0
