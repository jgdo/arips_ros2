# Component manager config for the Gazebo simulation.
# base_power, kinect, servos and lidar are left out: the simulation provides them.
# shutdown is left out as well, it would power off the host.
# localization is replaced by the static map and ground truth odometry in startup.launch.py.
components:
  xbox_teleop:
    package: arips_launch
    file: launch/teleop_xbox.launch.py
    dependencies: []
  arm_teleop:
    package: arips_teleop
    file: launch/teleop.launch.py
    dependencies: [xbox_teleop]
    arguments:
      # Kinect tilt on the d-pad vertical axis instead of buttons 11/12
      kinect_up_button: 'axis7'
      kinect_down_button: '-axis7'
  full_navigation:
    package: arips_launch
    file: launch/nav2.launch.py
    dependencies: [arips_actions]
    arguments:
      use_sim_time: 'true'
      # One container process instead of ~12 nodes: with separate processes bt_navigator
      # sometimes did not discover the planner's action server and bringup failed.
      use_composition: 'true'
  # On the real robot this runs as part of the servos component. It provides the
  # /arm_controller and /door_gripper_group_controller actions that move_group executes on.
  joint_trajectory_server:
    package: joint_trajectory_server
    file: launch/joint_trajectory_server.launch.py
    dependencies: []
    arguments:
      use_sim_time: 'true'
  move_group:
    package: arips_moveit_config
    file: launch/move_group.launch.py
    dependencies: [joint_trajectory_server]
    arguments:
      use_sim_time: 'true'
  # Navigation plus all arips_actions servers, with the learned GrabDoorHandle server
  # (doorhandle model + command_rate_limiter) instead of the direct sim one. Start either this
  # or full_navigation (+ arips_actions), never both.
  full_navigation_policy:
    package: arips_launch
    file: launch/nav2_grab_policy.launch.py
    dependencies: [move_group]
    arguments:
      use_sim_time: 'true'
      use_composition: 'true'
  # Action servers of the navigation behavior trees. They need move_group (compute_ik and
  # compute_cartesian_path) to be up when they start.
  arips_actions:
    package: arips_actions
    file: launch/arips_actions.launch.py
    dependencies: [move_group]
    arguments:
      use_sim_time: 'true'
      sim: 'true'
