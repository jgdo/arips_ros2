# Component manager config for the Gazebo simulation.
# base_power, kinect, servos and lidar are left out: the simulation provides them.
# shutdown is left out as well, it would power off the host.
# localization is replaced by the static map and ground truth odometry in startup.launch.py.
components:
  xbox_teleop:
    package: arips_launch
    file: launch/teleop_xbox.launch.py
    dependencies: []
  arm_teleop:
    package: arips_teleop
    file: launch/teleop.launch.py
    dependencies: [xbox_teleop]
    arguments:
      # Kinect tilt on the d-pad vertical axis instead of buttons 11/12
      kinect_up_button: 'axis7'
      kinect_down_button: '-axis7'
  full_navigation:
    package: arips_launch
    file: launch/nav2.launch.py
    dependencies: []
    arguments:
      use_sim_time: 'true'
  # On the real robot this runs as part of the servos component. It provides the
  # /arm_controller and /door_gripper_group_controller actions that move_group executes on.
  joint_trajectory_server:
    package: joint_trajectory_server
    file: launch/joint_trajectory_server.launch.py
    dependencies: []
    arguments:
      use_sim_time: 'true'
  move_group:
    package: arips_moveit_config
    file: launch/move_group.launch.py
    dependencies: [joint_trajectory_server]
    arguments:
      use_sim_time: 'true'
