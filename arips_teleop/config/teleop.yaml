arips_arm_teleop:
  ros__parameters:
    link_name: link_3   # last link of the arm (SCARA chain base_link -> link_3 is validated)
    # Joints sent in the command, in order; must include joint_slider, joint_2, joint_3, joint_4.
    # Joints outside the arm keep their current position.
    joint_names: [joint_slider, joint_2, joint_3, joint_4, joint_door_gripper]
    command_topic: /arm_forward_position_controller/commands
    joint_states_topic: /joint_states
    command_rate: 100.0   # Hz, rate of joint commands while the enable button is held
    # m, the arm only moves if the closest reachable pose is at most this far from the target
    max_position_deviation: 0.1
    joy_timeout: 0.2     # s, stop the arm if no joy message arrives for this long
    enable_button: 4
    linear_axes: [0, -1, 4]
    angular_axes: [-99, -99, 3]
    linear_scale: 0.1
    angular_scale: 1.0
