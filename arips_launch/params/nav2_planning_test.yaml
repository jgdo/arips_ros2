smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: arips_wheel_center
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      footprint_padding: 0.01
      plugins: ['obstacle_layer', 'inflation_layer']
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 12.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.235
          raytrace_min_range: 0.0
          
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.1
      always_send_full_costmap: true

    local_costmap_client:
      ros__parameters:
        use_sim_time: false
    local_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: arips_wheel_center
      transform_tolerance: 1.0
      robot_radius: 0.22
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /corrected_map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false # For now use slam_toolbox updates
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 12.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.235
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.1
      always_send_full_costmap: true

    global_costmap_client:
      ros__parameters:
        use_sim_time: false
    global_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

route_server:
  ros__parameters:
    graph_filepath: "/tmp/arips_route_graph.geojson"
    base_frame: arips_wheel_center
    route_frame: map

    enable_nn_search: true
    num_nearest_nodes: 5
    max_nn_search_iterations: 10000

    graph_file_loader: "GeoJsonGraphFileLoader"
    graph_file_loader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"

    use_sim_time: false
    boundary_radius_to_achieve_node: 0.01
    radius_to_achieve_node: 0.01
    smooth_corners: false
    operations: ['AdjustSpeedLimit', 'ReroutingService']
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions: ['DistanceScorer']
    DistanceScorer:
      plugin: nav2_route::DistanceScorer

# Not used by this robot; required because nav2_bringup's navigation_launch.py always starts it.
docking_server:
  ros__parameters:
    use_sim_time: false
    base_frame: arips_wheel_center
    fixed_frame: odom
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugins: ['wait_at_waypoint']
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: arips_wheel_center
    odom_topic: /csm_odom
    simulate_ahead_time: 2.0
    cycle_frequency: 10.0
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'assisted_teleop', 'wait']
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /csm_odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: arips_wheel_center
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    polygons: ['FootprintStop']
    observation_sources: ['scan']
    scan:
      type: scan
      topic: /scan
      min_height: 0.0
      max_height: 1.0
      enabled: false
    FootprintStop:
      type: polygon
      action_type: stop
      points: '[[0.22, 0.0], [0.156, 0.156], [0.0, 0.22], [-0.156, 0.156], [-0.22, 0.0], [-0.156, -0.156], [0.0, -0.22], [0.156, -0.156]]'
      min_points: 4
      visualize: false
      polygon_subsample: 5
      enabled: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server', 'smoother_server', 'planner_server', 'route_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother', 'collision_monitor', 'docking_server']
