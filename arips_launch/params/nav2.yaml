bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: arips_wheel_center
    odom_topic: /csm_odom
    transform_tolerance: 0.5
    # Default is 1000 ms. BT service/action nodes (e.g. /compute_semantic_route) are not
    # discovered within 1 s on this setup, which makes BT loading and activation fail.
    wait_for_service_timeout: 10000
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    default_nav_to_pose_bt_xml: $(find-pkg-share arips_launch)/behavior_trees/door_opening_behavior.xml
    #default_nav_to_pose_bt_xml: $(find-pkg-share arips_launch)/behavior_trees/experimental_behavior.xml
    plugin_lib_names: ['arips_nav2_bt_plugins_route_counter', 'arips_nav2_bt_plugins_compute_semantic_route', 'arips_nav2_bt_plugins_pop_next_semantic_route_segment', 'arips_nav2_bt_plugins_cross_door_step', 'arips_nav2_bt_plugins_grab_door_handle', 'arips_nav2_bt_plugins_get_door_grasping_approach_pose', 'arips_nav2_bt_plugins_drive_around_pivot', 'arips_nav2_bt_plugins_retreat_from_pivot', 'arips_nav2_bt_plugins_drive_forward', 'arips_nav2_bt_plugins_offset_pose']
    #default_nav_to_pose_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    # Default 'odom' has no publisher. Without odometry DWB assumes the robot stands still
    # and circles around goals instead of reaching them.
    odom_topic: /csm_odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ['progress_checker']
    goal_checker_plugins: ['general_goal_checker', 'precise_goal_checker', 'coarse_goal_checker']
    # Graceful reached the door grasp approach pose 30/30 times within 3 cm / 2 deg in sim.
    # RPP+RotationShim failed ~15% (spun in place near the goal), MPPI 0/10, DWB stopped short.
    # The RPP and DWB blocks below are kept as unused alternatives (add them here to load them).
    controller_plugins: ['FollowPath']
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Room waypoints are intermediate goals. With 0.05 m DWB sometimes circles a goal
      # at ~10 cm radius and never reaches it.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.5
    # Used by door_opening_behavior.xml to reach the door handle approach pose.
    # The robot stops as soon as it is inside these tolerances, so they are set below the
    # required 5 cm to leave some margin (RPP + RotationShim reaches them reliably).
    precise_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.035
    # Used by door_opening_behavior.xml for the second approach after pulling the door,
    # which only needs to be roughly at the approach pose.
    coarse_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    # Unused alternative: RotationShim + Regulated Pure Pursuit. The shim turns in place towards the path
    # first, and at the end turns in place to the goal heading once the robot is within
    # the goal checker's xy tolerance. RPP itself steers straight at the path end, so
    # it converges on the goal position.
    RPP:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.3
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: true
      primary_controller:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        max_linear_vel: 0.15
        lookahead_dist: 0.3
        min_lookahead_dist: 0.15
        max_lookahead_dist: 0.6
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: false
        min_approach_linear_velocity: 0.03
        approach_velocity_scaling_dist: 0.4
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.5
        regulated_linear_scaling_min_speed: 0.05
        use_fixed_curvature_lookahead: false
        curvature_lookahead_dist: 0.3
        # Turn in place when the carrot is more than rotate_to_heading_min_angle off. Without
        # it, after passing the path end just outside the goal tolerance, the carrot was
        # behind the robot and RPP drove a forward circle near the wall.
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.785
        rotate_to_heading_angular_vel: 0.4
        max_angular_accel: 1.0
        allow_reversing: false
        max_robot_pose_search_dist: 1.0
        interpolate_curvature_after_goal: false
        transform_tolerance: 0.5
    # Graceful controller: smooth control law that converges on position and heading of
    # a lookahead pose on the path, rotates in place at start and end.
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.5
      min_lookahead: 0.25
      max_lookahead: 0.6
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      # Fast between goals; within slowdown_radius of the goal the linear speed ramps
      # down so the precise goal checker (3 cm / 2 deg) is still reached without overshoot.
      v_linear_min: 0.03
      v_linear_max: 0.35
      v_angular_max: 1.0
      v_angular_min_in_place: 0.2
      slowdown_radius: 0.6
      initial_rotation: true
      initial_rotation_tolerance: 0.4
      prefer_final_rotation: true
      rotation_scaling_factor: 0.7
      allow_backward: false
      use_collision_detection: true
      in_place_collision_resolution: 0.1
    # Unused alternative: previous DWB setup.
    DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_theta: 0.2
      min_speed_xy: -0.3
      max_speed_xy: 0.2
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.4
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      # 1.5 s trajectories near goals close to walls all hit obstacles, so DWB stopped short.
      sim_time: 0.8
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 50.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 50.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 50.0
      GoalDist.scale: 50.0
      RotateToGoal.scale: 50.0
      RotateToGoal.slowing_factor: 5.0
      # -1 judged the heading at the end of sim_time (1.5 s), which favoured fast turns
      # that overshot the goal heading.
      RotateToGoal.lookahead_time: 0.3
      PreferForward:
        classname: "dwb_critics::PreferForwardCritic"
        scale: 10.0
        penalty: 1.0


smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: arips_wheel_center
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025
      # Regular octagon, 0.43 m between parallel sides, centered on base_link
      # (0.10 m behind arips_wheel_center).
      footprint: '[[0.115, -0.089], [0.115, 0.089], [-0.011, 0.215], [-0.189, 0.215], [-0.315, 0.089], [-0.315, -0.089], [-0.189, -0.215], [-0.011, -0.215]]'
      footprint_padding: 0.01
      plugins: ['obstacle_layer', 'inflation_layer']
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 12.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.235
          raytrace_min_range: 0.0
          
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.10
      always_send_full_costmap: true

    local_costmap_client:
      ros__parameters:
        use_sim_time: false
    local_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: arips_wheel_center
      transform_tolerance: 1.0
      # Regular octagon, 0.43 m between parallel sides, centered on base_link
      # (0.10 m behind arips_wheel_center).
      footprint: '[[0.115, -0.089], [0.115, 0.089], [-0.011, 0.215], [-0.189, 0.215], [-0.315, 0.089], [-0.315, -0.089], [-0.189, -0.215], [-0.011, -0.215]]'
      footprint_padding: 0.01
      resolution: 0.025
      track_unknown_space: true
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true # laser updates needed so moved obstacles (e.g. the opened door leaf) are planned around
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 12.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.235
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.25  # NavFn plans for a point robot: keep paths well clear of obstacles (e.g. the open door leaf). Local costmap stays at 0.10.
      always_send_full_costmap: true

    global_costmap_client:
      ros__parameters:
        use_sim_time: false
    global_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

route_server:
  ros__parameters:
    use_sim_time: false
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    graph_filepath: "/tmp/arips_route_graph.geojson"
    operations: ['AdjustSpeedLimit', 'ReroutingService', 'CollisionMonitor']
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions: ['DistanceScorer', 'CostmapScorer']
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer

# Not used by this robot; required because nav2_bringup's navigation_launch.py always starts it.
docking_server:
  ros__parameters:
    use_sim_time: false
    base_frame: arips_wheel_center
    fixed_frame: odom
    odom_topic: /csm_odom
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugins: ['wait_at_waypoint']
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: arips_wheel_center
    odom_topic: /csm_odom
    simulate_ahead_time: 2.0
    cycle_frequency: 10.0
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'assisted_teleop', 'wait']
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /csm_odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: arips_wheel_center
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    polygons: ['FootprintStop']
    observation_sources: ['scan']
    scan:
      type: scan
      topic: /scan
      min_height: 0.0
      max_height: 1.0
      enabled: false
    FootprintStop:
      type: polygon
      action_type: stop
      # Same octagon as the costmap footprint (centered on base_link).
      points: '[[0.115, -0.089], [0.115, 0.089], [-0.011, 0.215], [-0.189, 0.215], [-0.315, 0.089], [-0.315, -0.089], [-0.189, -0.215], [-0.011, -0.215]]'
      min_points: 4
      visualize: false
      polygon_subsample: 5
      enabled: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    # Default is 4.0 s. DDS discovery on this setup (ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET,
    # many running nodes) is slow enough that the controller_server bond is not seen in time
    # right after the local costmap starts, which aborts the whole bringup.
    bond_timeout: 20.0
    node_names: ['controller_server', 'smoother_server', 'planner_server', 'route_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother', 'collision_monitor', 'docking_server']
