# Feetech servo calibration config for arips_ros2 (see feetech_ros2_driver docs).
# WARNING: all values below are PLACEHOLDERS and MUST be calibrated per physical
# servo before enabling torque, e.g. via feetech_ros2_driver's ping/read_position
# demo tools. Do not trust range_min/range_max/homing_offset as-is.
joints:
  kinect_joint_0:
    id: 5
    homing_offset: 0
    range_min: 0
    range_max: 4095
    p_coefficient: 16
    d_coefficient: 32
    i_coefficient: 0
    acceleration: 50
