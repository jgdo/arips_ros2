components:
  base_power:
    package: arips_launch
    file: launch/base_power.launch.py
    dependencies: []  # no dependencies
  xbox_teleop:
    package: arips_launch
    file: launch/teleop_xbox.launch.py
    dependencies: [base_power]
  lidar:
    package: arips_launch
    file: launch/lidar.launch.py
    dependencies: [base_power] 
  servos:
    package: arips_launch
    file: launch/servo_control.launch.py
    dependencies: [base_power]
  kinect:
    package: kinect_ros2
    file: launch/kinect.launch.py
    dependencies: [base_power]
  localization:
    package: arips_launch
    file: launch/localization.launch.py
    dependencies: [lidar]
  full_navigation:
    package: arips_launch
    file: launch/nav2.launch.py
    dependencies: [localization]
  shutdown:
    package: arips_launch
    file: launch/shutdown.launch.py
    dependencies: [base_power]