components:
  base_power:
    package: arips_launch
    file: launch/base_power.launch.py
    dependencies: []  # no dependencies
  xbox_teleop:
    package: arips_launch
    file: launch/teleop_xbox.launch.py
    dependencies: [base_power]
  arm_teleop:
    package: arips_teleop
    file: launch/teleop.launch.py
    dependencies: [xbox_teleop, servos]
  lidar:
    package: arips_launch
    file: launch/lidar.launch.py
    dependencies: [base_power] 
  servos:
    package: arips_launch
    file: launch/servo_control.launch.py
    dependencies: [base_power]
  kinect:
    package: kinect_ros2
    file: launch/kinect.launch.py
    dependencies: [base_power]
  localization:
    package: arips_launch
    file: launch/localization.launch.py
    dependencies: [lidar]
  # Action servers of the navigation behavior trees (door opening, arm moves)
  arips_actions:
    package: arips_actions
    file: launch/arips_actions.launch.py
    dependencies: [localization, servos]
  full_navigation:
    package: arips_launch
    file: launch/nav2.launch.py
    dependencies: [localization, arips_actions]
  shutdown:
    package: arips_launch
    file: launch/shutdown.launch.py
    dependencies: [base_power]