<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIPS Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
#top { display: flex; flex: 1; overflow: hidden; }
#sidebar {
  width: 260px; min-width: 200px; border-right: 1px solid #ccc;
  padding: 10px; overflow-y: auto;
}
#sidebar h2 { margin-bottom: 8px; font-size: 16px; }
#components-list { list-style: none; }
#components-list li { padding: 4px 0; display: flex; align-items: center; justify-content: space-between; }
#components-list label { cursor: pointer; }
#components-list label.comp-failed { font-weight: bold; color: #c00; }
#components-list input[type="checkbox"]:disabled { cursor: not-allowed; }
#components-list .log-btn {
  cursor: pointer; border: none; background: none; font-size: 14px;
  line-height: 1; padding: 2px 4px; opacity: 0.6;
}
#components-list .log-btn:hover { opacity: 1; }
#comp-popup {
  position: absolute; display: none; max-width: 260px; z-index: 1000;
  background: #fff; border: 1px solid #999; border-radius: 4px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#comp-popup .dep-line { margin-top: 2px; }
#log-modal-overlay {
  position: fixed; display: none; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000;
  align-items: center; justify-content: center;
}
#log-modal {
  width: 70vw; height: 70vh; background: #fff; border-radius: 6px;
  display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#log-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid #ccc;
}
#log-modal-header h3 { font-size: 14px; }
#log-modal-close { cursor: pointer; border: none; background: none; font-size: 18px; }
#log-modal-body {
  flex: 1; overflow: auto; margin: 0; padding: 10px;
  font-family: monospace; font-size: 12px; white-space: pre-wrap;
  background: #1e1e1e; color: #d4d4d4;
}
#main { flex: 1; display: flex; align-items: center; justify-content: center; color: #888; }
#bottom {
  height: 180px; border-top: 1px solid #ccc;
  display: flex; align-items: center; justify-content: center; position: relative;
}
#joystick-zone { width: 160px; height: 160px; }
#status { position: absolute; top: 4px; right: 10px; font-size: 12px; }
#connection-status { position: absolute; top: 10px; right: 10px; font-size: 12px; }
.connected { color: green; }
.disconnected { color: red; }
/* Kinect tilt control (vertical slider) */
#kinect-tilt-control {
  position: fixed;
  right: 0;
  top: 60px;
  bottom: 60px;
  width: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.95);
  border-left: 1px solid #ccc;
  padding: 8px;
  z-index: 1000;
}
#kinect-tilt-value { margin-bottom: 8px; font-size: 14px; font-weight: 600; }
.kinect-slider-wrapper { height: 240px; display: flex; align-items: center; }
#kinect-tilt-slider { transform: rotate(-90deg); width: 220px; }
</style>
</head>
<body>

<div id="connection-status" class="disconnected">Disconnected</div>
<div id="kinect-tilt-control">
  <div id="kinect-tilt-value">0°</div>
  <div class="kinect-slider-wrapper">
    <input type="range" id="kinect-tilt-slider" min="-90" max="0" step="1" value="0">
  </div>
</div>
<div id="comp-popup"></div>
<div id="log-modal-overlay">
  <div id="log-modal">
    <div id="log-modal-header">
      <h3 id="log-modal-title">Log</h3>
      <button id="log-modal-close">✕</button>
    </div>
    <pre id="log-modal-body"></pre>
  </div>
</div>

<div id="top">
  <div id="sidebar">
    <h2>Components</h2>
    <ul id="components-list"><li>Loading...</li></ul>
  </div>
  <div id="main"></div>
</div>

<div id="bottom">
  <div id="joystick-zone"></div>
  <div id="status">vel: 0.00 / 0.00</div>
</div>

<script>
(function() {
  // ── ROS connection ───────────────────────────────────────────
  var wsUrl = 'ws://arips:9090';
  var ros = new ROSLIB.Ros({ url: wsUrl });

  var connEl = document.getElementById('connection-status');
  ros.on('connection', function() {
    connEl.textContent = 'Connected';
    connEl.className = 'connected';
    fetchComponents();
  });
  ros.on('error', function() {
    connEl.textContent = 'Error';
    connEl.className = 'disconnected';
  });
  ros.on('close', function() {
    connEl.textContent = 'Disconnected';
    connEl.className = 'disconnected';
  });

  // ── Component list ───────────────────────────────────────────
  var listEl = document.getElementById('components-list');
  var popupEl = document.getElementById('comp-popup');
  var componentStates = {}; // name -> {running, state, dependencies, checkbox, label}
  var pendingActions = {};  // name -> true while a service call is in-flight
  // ComponentsState constants (mirrored from component_manager_msgs/msg/ComponentsState)
  var STATE_OFF = 0;
  var STATE_RUNNING = 1;
  var STATE_SHUTTING_DOWN = 2;
  var STATE_FAILURE = 3;
  var STATE_DEPENDENCY_FAILURE = 4;
  var STATE_NAMES = ['OFF', 'RUNNING', 'SHUTTING_DOWN', 'FAILURE', 'DEPENDENCY_FAILURE'];
  var HOVER_DELAY_MS = 1000;
  var hoverTimer = null;

  var listClient = new ROSLIB.Service({
    ros: ros,
    name: '/component_manager/list_components',
    serviceType: 'component_manager_msgs/srv/ListComponents'
  });

  var startClient = new ROSLIB.Service({
    ros: ros,
    name: '/component_manager/start_component',
    serviceType: 'component_manager_msgs/srv/StartComponent'
  });

  var stopClient = new ROSLIB.Service({
    ros: ros,
    name: '/component_manager/stop_component',
    serviceType: 'component_manager_msgs/srv/StopComponent'
  });

  var logClient = new ROSLIB.Service({
    ros: ros,
    name: '/component_manager/get_component_log',
    serviceType: 'component_manager_msgs/srv/GetComponentLog'
  });

  var stateSub = new ROSLIB.Topic({
    ros: ros,
    name: '/component_manager/components_state',
    messageType: 'component_manager_msgs/msg/ComponentsState'
  });

  stateSub.subscribe(function(msg) {
    updateComponentUI(msg.names, decodeStateArray(msg.state), msg.dependencies);
  });

  function fetchComponents() {
    listClient.callService(new ROSLIB.ServiceRequest({}), function(result) {
      var state = result.state;
      buildComponentList(state.names, decodeStateArray(state.state), state.dependencies);
    }, function(err) {
      listEl.innerHTML = '<li>Error loading components</li>';
      console.error('ListComponents failed:', err);
    });
  }

  // rosbridge sends uint8[] fields as a base64 string rather than a JS array
  function decodeStateArray(states) {
    if (typeof states !== 'string') {
      return states;
    }
    var binary = atob(states);
    var arr = new Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      arr[i] = binary.charCodeAt(i);
    }
    return arr;
  }

  function isFailed(state) {
    return state === STATE_FAILURE || state === STATE_DEPENDENCY_FAILURE;
  }

  function isChecked(state) {
    return state === STATE_RUNNING || state === STATE_SHUTTING_DOWN;
  }

  function buildComponentList(names, states, dependencies) {
    listEl.innerHTML = '';
    componentStates = {};
    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var state = states[i];
      var deps = JSON.parse(dependencies[i] || '[]');

      var li = document.createElement('li');
      var label = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isChecked(state);
      cb.disabled = state === STATE_SHUTTING_DOWN;
      cb.dataset.component = name;
      cb.addEventListener('change', onCheckboxChange);
      label.className = isFailed(state) ? 'comp-failed' : '';
      label.appendChild(cb);
      label.appendChild(document.createTextNode(' ' + name));
      label.addEventListener('mouseenter', onLabelMouseEnter);
      label.addEventListener('mouseleave', onLabelMouseLeave);
      li.appendChild(label);

      var logBtn = document.createElement('button');
      logBtn.className = 'log-btn';
      logBtn.title = 'Show log for "' + name + '"';
      logBtn.textContent = '📄';
      logBtn.dataset.component = name;
      logBtn.addEventListener('click', onLogButtonClick);
      li.appendChild(logBtn);

      listEl.appendChild(li);

      componentStates[name] = {
        state: state, dependencies: deps,
        checkbox: cb, label: label
      };
    }
  }

  function updateComponentUI(names, states, dependencies) {
    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var state = states[i];
      var entry = componentStates[name];
      if (entry) {
        entry.state = state;
        entry.dependencies = JSON.parse(dependencies[i] || '[]');
        entry.label.className = isFailed(state) ? 'comp-failed' : '';
        entry.checkbox.disabled = state === STATE_SHUTTING_DOWN;
        if (!pendingActions[name]) {
          entry.checkbox.checked = isChecked(state);
        }
      } else {
        // New component appeared — rebuild
        buildComponentList(names, states, dependencies);
        return;
      }
    }
  }

  // ── Hover popup ──────────────────────────────────────────────
  function onLabelMouseEnter(e) {
    var label = e.currentTarget;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(function() {
      showPopup(label);
    }, HOVER_DELAY_MS);
  }

  function onLabelMouseLeave() {
    clearTimeout(hoverTimer);
    hidePopup();
  }

  function showPopup(label) {
    var name = label.querySelector('input').dataset.component;
    var entry = componentStates[name];
    if (!entry) {
      return;
    }

    var html = '<strong>' + name + '</strong>: ' + (STATE_NAMES[entry.state] || entry.state);
    if (entry.dependencies.length === 0) {
      html += '<div class="dep-line">no dependencies</div>';
    } else {
      for (var i = 0; i < entry.dependencies.length; i++) {
        var depName = entry.dependencies[i];
        var depEntry = componentStates[depName];
        var depState = depEntry ? (STATE_NAMES[depEntry.state] || depEntry.state) : 'unknown';
        html += '<div class="dep-line">' + depName + ': ' + depState + '</div>';
      }
    }
    popupEl.innerHTML = html;

    var rect = label.getBoundingClientRect();
    popupEl.style.left = (rect.left + window.scrollX) + 'px';
    popupEl.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    popupEl.style.display = 'block';
  }

  function hidePopup() {
    popupEl.style.display = 'none';
  }

  function onCheckboxChange(e) {
    var name = e.target.dataset.component;
    var shouldRun = e.target.checked;

    pendingActions[name] = true;

    var client = shouldRun ? startClient : stopClient;
    var req = new ROSLIB.ServiceRequest({ name: name });

    client.callService(req, function(result) {
      delete pendingActions[name];
      if (!result.success) {
        // Revert checkbox on failure
        e.target.checked = !shouldRun;
        console.warn('Service call failed:', result.message);
      } else {
        syncCheckbox(name);
      }
    }, function(err) {
      delete pendingActions[name];
      e.target.checked = !shouldRun;
      console.error('Service call error:', err);
    });
  }

  // Re-apply the last known state to a checkbox once it's no longer pending
  function syncCheckbox(name) {
    var entry = componentStates[name];
    if (entry) {
      entry.checkbox.checked = isChecked(entry.state);
    }
  }

  // ── Log modal ────────────────────────────────────────────────
  var logModalOverlay = document.getElementById('log-modal-overlay');
  var logModalTitle = document.getElementById('log-modal-title');
  var logModalBody = document.getElementById('log-modal-body');
  document.getElementById('log-modal-close').addEventListener('click', closeLogModal);
  logModalOverlay.addEventListener('click', function(e) {
    if (e.target === logModalOverlay) {
      closeLogModal();
    }
  });

  function onLogButtonClick(e) {
    var name = e.currentTarget.dataset.component;
    logModalTitle.textContent = 'Log: ' + name;
    logModalBody.innerHTML = 'Loading...';
    logModalOverlay.style.display = 'flex';

    logClient.callService(new ROSLIB.ServiceRequest({ name: name }), function(result) {
      if (logModalOverlay.style.display === 'none') {
        return; // modal was closed before the response arrived
      }
      logModalBody.innerHTML = result.success
        ? ansiToHtml(result.log || '(empty log)')
        : ansiToHtml('Error: ' + result.message);
      logModalBody.scrollTop = logModalBody.scrollHeight;
    }, function(err) {
      logModalBody.innerHTML = ansiToHtml('Failed to fetch log: ' + err);
    });
  }

  function closeLogModal() {
    logModalOverlay.style.display = 'none';
  }

  // Renders captured stdout/stderr (piped through a pty, so it retains ANSI
  // SGR color codes) as HTML spans instead of raw escape sequences.
  function ansiToHtml(text) {
    var FG = {
      30: '#000000', 31: '#e06c75', 32: '#98c379', 33: '#e5c07b',
      34: '#61afef', 35: '#c678dd', 36: '#56b6c2', 37: '#d4d4d4',
      90: '#5c6370', 91: '#e06c75', 92: '#98c379', 93: '#e5c07b',
      94: '#61afef', 95: '#c678dd', 96: '#56b6c2', 97: '#ffffff'
    };
    var BG = {
      40: '#000000', 41: '#e06c75', 42: '#98c379', 43: '#e5c07b',
      44: '#61afef', 45: '#c678dd', 46: '#56b6c2', 47: '#d4d4d4'
    };

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    var out = '';
    var spanOpen = false;
    var fg = null, bg = null, bold = false;
    var lastIndex = 0;
    var re = /\x1b\[([0-9;]*)m/g;
    var match;

    function flushSpan() {
      if (spanOpen) {
        out += '</span>';
        spanOpen = false;
      }
      var style = '';
      if (fg) style += 'color:' + fg + ';';
      if (bg) style += 'background-color:' + bg + ';';
      if (bold) style += 'font-weight:bold;';
      if (style) {
        out += '<span style="' + style + '">';
        spanOpen = true;
      }
    }

    while ((match = re.exec(text)) !== null) {
      out += escapeHtml(text.slice(lastIndex, match.index));
      lastIndex = re.lastIndex;

      var codes = match[1].length ? match[1].split(';').map(Number) : [0];
      for (var i = 0; i < codes.length; i++) {
        var code = codes[i];
        if (code === 0) {
          fg = null; bg = null; bold = false;
        } else if (code === 1) {
          bold = true;
        } else if (code === 22) {
          bold = false;
        } else if (code === 39) {
          fg = null;
        } else if (code === 49) {
          bg = null;
        } else if (FG[code] !== undefined) {
          fg = FG[code];
        } else if (BG[code] !== undefined) {
          bg = BG[code];
        }
      }
      flushSpan();
    }
    out += escapeHtml(text.slice(lastIndex));
    if (spanOpen) {
      out += '</span>';
    }
    return out;
  }

  // ── Joystick / cmd_vel ───────────────────────────────────────
  var cmdVelPub = new ROSLIB.Topic({
    ros: ros,
    name: '/cmd_vel',
    messageType: 'geometry_msgs/msg/Twist'
  });

  var statusEl = document.getElementById('status');
  var linearX = 0;
  var angularZ = 0;
  var maxLinear = 0.5;  // m/s
  var maxAngular = 1.0; // rad/s
  var publishTimer = null;

  function publishTwist() {
    var twist = new ROSLIB.Message({
      linear: { x: linearX, y: 0, z: 0 },
      angular: { x: 0, y: 0, z: angularZ }
    });
    cmdVelPub.publish(twist);
  }

  var joystick = nipplejs.create({
    zone: document.getElementById('joystick-zone'),
    mode: 'static',
    position: { left: '50%', top: '50%' },
    color: '#444',
    size: 120
  });

  joystick.on('start', function() {
    if (!publishTimer) {
      publishTimer = setInterval(publishTwist, 100);
    }
  });

  joystick.on('move', function(evt, data) {
    // data.vector.y = forward, data.vector.x = left-right
    var distance = Math.min(data.distance, 60) / 60; // normalize 0..1
    linearX = data.vector.y * distance * maxLinear;
    angularZ = -data.vector.x * distance * maxAngular;
    statusEl.textContent = 'vel: ' + linearX.toFixed(2) + ' / ' + angularZ.toFixed(2);
  });

  joystick.on('end', function() {
    if (publishTimer) {
      clearInterval(publishTimer);
      publishTimer = null;
    }
    linearX = 0;
    angularZ = 0;
    publishTwist();
    statusEl.textContent = 'vel: 0.00 / 0.00';
  });

  // ── Kinect tilt slider ───────────────────────────────────────
  var kinectPub = new ROSLIB.Topic({
    ros: ros,
    name: '/kinect_forward_position_controller/commands',
    messageType: 'std_msgs/msg/Float64MultiArray'
  });

  function publishKinectDeg(deg) {
    var valEl = document.getElementById('kinect-tilt-value');
    if (valEl) { valEl.textContent = deg + '°'; }
    var rad = deg * Math.PI / 180.0;
    var msg = new ROSLIB.Message({ data: [rad] });
    try { kinectPub.publish(msg); } catch (e) { console.warn('kinect publish failed', e); }
  }

  var kinectSlider = document.getElementById('kinect-tilt-slider');
  var lastKinectDeg = null;
  var isKinectDragging = false;
  var lastDragEndTime = 0; // ms since epoch
  var suppressSliderPublish = false; // when true, slider input won't publish

  // subscribe to joint_states to reflect the actual kinect_joint angle when not dragging
  var jointStateSub = new ROSLIB.Topic({
    ros: ros,
    name: '/joint_states',
    messageType: 'sensor_msgs/msg/JointState'
  });

  jointStateSub.subscribe(function(msg) {
    try {
      var names = msg.name || [];
      var idx = names.indexOf('kinect_joint');
      if (idx >= 0 && Array.isArray(msg.position) && msg.position.length > idx) {
        var rad = msg.position[idx];
        var deg = Math.round(rad * 180.0 / Math.PI);
        lastKinectDeg = deg;
        if (!isKinectDragging) {
          // update visible label always
          var valEl = document.getElementById('kinect-tilt-value');
          if (valEl) { valEl.textContent = deg + '°'; }

          // if the user hasn't dragged recently, update the slider position
          if (Date.now() - lastDragEndTime > 1000 && kinectSlider) {
            var cur = parseInt(kinectSlider.value, 10);
            if (cur !== deg) {
              suppressSliderPublish = true;
              // clamp deg into slider range
              var clamped = Math.max(-90, Math.min(0, deg));
              kinectSlider.value = clamped;
              // ensure label matches exactly
              if (valEl) { valEl.textContent = clamped + '°'; }
              // allow input handler to run again shortly after
              setTimeout(function() { suppressSliderPublish = false; }, 50);
            }
          }
        }
      }
    } catch (e) {
      console.warn('joint_states handler error', e);
    }
  });

  if (kinectSlider) {
    kinectSlider.addEventListener('pointerdown', function() { isKinectDragging = true; });
    kinectSlider.addEventListener('input', function(e) {
      if (suppressSliderPublish) { return; }
      var deg = parseInt(e.target.value, 10);
      publishKinectDeg(deg);
    });
    // detect end of drag anywhere on the page
    window.addEventListener('pointerup', function() {
      if (isKinectDragging) {
        isKinectDragging = false;
        lastDragEndTime = Date.now();
        var valEl = document.getElementById('kinect-tilt-value');
        if (valEl) {
          if (lastKinectDeg !== null) {
            // when not dragging, label should reflect joint_states
            valEl.textContent = lastKinectDeg + '°';
          } else {
            // fallback to slider value
            valEl.textContent = kinectSlider.value + '°';
          }
        }
      }
    });
  }

})();
</script>
</body>
</html>
