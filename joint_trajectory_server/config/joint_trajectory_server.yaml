joint_trajectory_server:
  ros__parameters:
    # Controllable joints; order defines the layout of the command array.
    joints: ["joint_slider", "joint_2", "joint_3", "joint_4", "joint_door_gripper"]
    # Limits used for time-scaling the interpolated trajectory (rad/s, rad/s^2 or m/s, m/s^2)
    max_velocity: [0.2, 1.0, 1.0, 1.0, 1.0]
    max_acceleration: [0.2, 2.0, 2.0, 1.0, 1.0]

    command_rate: 50.0              # Hz, resampling / command publishing rate
    max_start_deviation: 0.1        # max |first trajectory point - current state| per joint
    goal_tolerance: 0.02            # per-joint final position tolerance
    progress_timeout: 0.7           # s without movement of an expected-to-move joint -> abort
    progress_threshold: 0.002       # min position change counting as progress
    state_timeout: 0.3              # s, joint states older than this are considered stale

    action_name: "follow_joint_trajectory"
    command_topic: "/arm_forward_position_controller/commands"
    joint_states_topic: "/joint_states"
    robot_description_topic: "/robot_description"
