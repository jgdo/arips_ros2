[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_doorhandle"
version = "0.1.0"
description = "LeRobot plugin: estimate the arm's door handle pre-grasp joint pose from one Kinect RGB-D frame and the current joints."
requires-python = ">=3.10"
dependencies = ["lerobot>=0.6.1", "torch", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]
